name: Catalog Visual Contract

on:
  push:
    branches:
      - chatgpt/store-build
    paths:
      - 'categories.php'
      - 'subcategories.php'
      - 'exd-layouts.css'
      - '.github/workflows/catalog-visual-contract.yml'
  pull_request:
    paths:
      - 'categories.php'
      - 'subcategories.php'
      - 'exd-layouts.css'
      - '.github/workflows/catalog-visual-contract.yml'

permissions:
  contents: read

concurrency:
  group: catalog-visual-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-contract:
    name: Category and subcategory visual contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate storefront catalog contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          contracts = {
              Path('categories.php'): [
                  "$cat['image']",
                  'class="exd-media"',
                  'loading="lazy"',
                  'class="card-body"',
                  'class="card-actions"',
                  'btn-card--minor',
                  '>التفاصيل</a>',
                  '>اطلب الآن</a>',
              ],
              Path('subcategories.php'): [
                  "$sub['image']",
                  'class="exd-media"',
                  'loading="lazy"',
                  'class="card-body"',
                  'class="card-actions"',
                  '>تصفح القسم</a>',
                  '>التفاصيل</a>',
                  '>اطلب الآن</a>',
              ],
          }

          # The card language must be declared somewhere in the stylesheets the
          # store ships, not in one particular file: .exd-media lives in
          # exd-media.css and .card-actions in style.css, and pinning them to
          # exd-layouts.css asserted something that was never true.
          stylesheets = {
              '.exd-media': ['exd-media.css', 'exd-layouts.css', 'exd-commerce.css', 'exd-tokens.css'],
              '.card-actions': ['style.css', 'storefront.css', 'exd-layouts.css', 'exd-commerce.css'],
              '.exd-rail': ['exd-layouts.css'],
              '.exd-keys': ['exd-layouts.css'],
              '.exd-duo': ['exd-layouts.css'],
              '.exd-secbanner': ['exd-layouts.css'],
          }

          failures = []
          for path, needles in contracts.items():
              if not path.exists():
                  failures.append(f'{path}: required storefront file missing')
                  continue
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      failures.append(f'{path}: missing catalog contract token: {needle}')

          for selector, candidates in stylesheets.items():
              present = [c for c in candidates if Path(c).exists() and selector in Path(c).read_text(encoding='utf-8')]
              if not present:
                  failures.append(f'{selector}: not declared in any of {", ".join(candidates)}')

          if failures:
              print('ERROR: storefront catalog visual contract regressed:', file=sys.stderr)
              for failure in failures:
                  print(f'  - {failure}', file=sys.stderr)
              raise SystemExit(1)

          print('Catalog visual contract is intact: media slots, card bodies, and actions are present.')
          PY

name: Staging Configuration Contract

on:
  push:
    branches:
      - chatgpt/store-build
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-staging-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate staging configuration names and placeholders
        run: |
          php -l tests/staging_configuration_contract.php
          php tests/staging_configuration_contract.php

      - name: Validation-only summary
        run: |
          echo "Staging configuration contract passed."
          echo "No secret values were read and no deployment or production connection was attempted."

name: Repository Governance Contract

on:
  push:
    branches:
      - chatgpt/store-build
    paths:
      - 'config/repository-governance-contract.json'
      - 'DEPLOYMENT_CHECKLIST.md'
      - 'tests/repository_governance_contract.php'
      - 'tests/branch_protection_check_names.php'
      - 'tests/release_candidate_semantics.php'
      - 'tests/staging_required_workflow_triggers.php'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'config/repository-governance-contract.json'
      - 'DEPLOYMENT_CHECKLIST.md'
      - 'tests/repository_governance_contract.php'
      - 'tests/branch_protection_check_names.php'
      - 'tests/release_candidate_semantics.php'
      - 'tests/staging_required_workflow_triggers.php'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate repository governance contract
        run: php tests/repository_governance_contract.php
      - name: Validate exact branch protection check contexts
        run: php tests/branch_protection_check_names.php
      - name: Validate release candidate semantic safety
        run: php tests/release_candidate_semantics.php
      - name: Validate exact-SHA staging workflow triggers
        run: php tests/staging_required_workflow_triggers.php

name: Backend production safety gate

on:
  push:
    branches:
      - chatgpt/store-build
    paths:
      - 'backend/**'
      - '.github/workflows/backend-safety.yml'
  pull_request:
    paths:
      - 'backend/**'

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect bundled backend recovery payload
        continue-on-error: true
        run: python backend/source_bundle_inspect.py
      - name: Compile deployment entrypoints
        run: |
          python -m py_compile backend/passenger_wsgi.py backend/staging_fallback.py backend/init_db.py backend/production_check.py
      - name: Reject committed real environment files
        run: |
          test ! -f backend/.env
          test -f backend/.env.example
      - name: Reject obvious secret material
        run: |
          ! grep -RniE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}|password[[:space:]]*=[[:space:]]*[^<][^ ]{12,})' backend --exclude='.env.example' --exclude='*.md' --exclude='*.b64'
      - name: Verify staging is isolated from live domain
        run: |
          grep -q 'e-network.net' backend/.env.example
          ! grep -q '^APP_URL=https://elawaady.com' backend/.env.example
      - name: Prove staging preflight rejects live APP_URL
        env:
          APP_ENV: staging
          APP_URL: https://elawaady.com
          DB_CONNECTION: mysql
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_USERNAME: ci_dummy_user
          DB_PASSWORD: ci_dummy_password_not_real
          DB_DATABASE: ci_dummy_database
          SESSION_SECRET: ci_session_secret_abcdefghijklmnopqrstuvwxyz012345
          ENCRYPTION_KEY: ci_encrypt_secret_abcdefghijklmnopqrstuvwxyz012345
          CORS_ALLOWED_ORIGINS: https://e-network.net,https://www.e-network.net
        run: |
          set +e
          output=$(python backend/production_check.py 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output" | grep -q 'Live elawaady.com must never be used as the staging APP_URL'
      - name: Exercise staging Passenger boot without exposing internals
        env:
          APP_ENV: staging
        run: |
          cd backend
          python - <<'PY'
          import io
          import json
          import passenger_wsgi

          captured = {}
          def start_response(status, headers):
              captured['status'] = status
              captured['headers'] = dict(headers)

          body = b''.join(passenger_wsgi.application({
              'PATH_INFO': '/api/v1/health',
              'REQUEST_METHOD': 'GET',
              'wsgi.input': io.BytesIO(b''),
          }, start_response))
          text = body.decode('utf-8', errors='replace')
          assert captured['status'].startswith(('200 ', '503 ')), captured['status']
          assert 'Traceback' not in text
          assert 'DB_PASSWORD' not in text
          assert 'SESSION_SECRET' not in text
          if captured['status'].startswith('503 '):
              payload = json.loads(text)
              assert payload['status'] == 'bootstrap_incomplete'
              assert payload['environment'] == 'staging'
          PY
      - name: Exercise production preflight with safe dummy MySQL config
        env:
          APP_ENV: production
          APP_URL: https://e-network.net
          DB_CONNECTION: mysql
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_USERNAME: ci_dummy_user
          DB_PASSWORD: ci_dummy_password_not_real
          DB_DATABASE: ci_dummy_database
          SESSION_SECRET: ci_session_secret_abcdefghijklmnopqrstuvwxyz012345
          ENCRYPTION_KEY: ci_encrypt_secret_abcdefghijklmnopqrstuvwxyz012345
          CORS_ALLOWED_ORIGINS: https://e-network.net,https://www.e-network.net
        run: python backend/production_check.py

name: Storefront Safety

on:
  push:
    branches:
      - chatgpt/store-build
  pull_request:
    paths:
      - '**/*.php'
      - '**/*.css'
      - '**/*.js'
      - 'migrations/**/*.sql'
      - '.github/workflows/storefront-safety.yml'

permissions:
  contents: read

concurrency:
  group: storefront-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-storefront-safety:
    name: PHP storefront syntax and staging preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PHP CLI and mysqli
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql

      - name: Lint storefront PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(
            find . -type f -name '*.php' \
              -not -path './vendor/*' \
              -not -path './legacy_reference/*' \
              -print0
          )

      - name: Guard homepage composition contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = {
              Path('index.php'): [
                  'require_once "sections.php";',
                  'exd_category_bands(',
                  "exd_banners_for($conn, 'home_mid')",
                  "exd_banners_for($conn, 'home_bottom')",
              ],
              Path('header.php'): [
                  'exd-layouts.css',
              ],
          }

          failures = []
          for path, needles in required.items():
              if not path.exists():
                  failures.append(f'{path}: file missing')
                  continue
              text = path.read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      failures.append(f'{path}: missing required homepage contract token: {needle}')

          if not Path('sections.php').exists():
              failures.append('sections.php: renderer missing')
          if not Path('exd-layouts.css').exists():
              failures.append('exd-layouts.css: layout stylesheet missing')

          if failures:
              print('ERROR: homepage composition contract regressed:', file=sys.stderr)
              for failure in failures:
                  print(f'  - {failure}', file=sys.stderr)
              raise SystemExit(1)

          print('Homepage composition contract is intact.')
          PY

      - name: Guard migrations against destructive SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          migration_dir = pathlib.Path('migrations')
          if not migration_dir.exists():
              print('No migrations directory; nothing to inspect.')
              raise SystemExit(0)

          destructive = re.compile(
              r'\b(?:DROP\s+(?:TABLE|DATABASE|COLUMN|INDEX)|TRUNCATE\s+TABLE|DELETE\s+FROM)\b',
              re.IGNORECASE,
          )
          block_comment = re.compile(r'/\*.*?\*/', re.DOTALL)
          line_comment = re.compile(r'(?m)^\s*--.*$')

          violations = []
          checked = 0
          for path in sorted(migration_dir.rglob('*.sql')):
              checked += 1
              text = path.read_text(encoding='utf-8')
              executable = block_comment.sub('', text)
              executable = line_comment.sub('', executable)
              match = destructive.search(executable)
              if match:
                  violations.append(f'{path}: {match.group(0)}')

          if violations:
              print('ERROR: destructive SQL detected in storefront migrations:', file=sys.stderr)
              for violation in violations:
                  print(f'  - {violation}', file=sys.stderr)
              print('Migrations on this branch must remain additive/non-destructive.', file=sys.stderr)
              raise SystemExit(1)

          print(f'Checked {checked} migration(s): no destructive SQL detected.')
          PY

      - name: Guard migration numbering and order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          migration_dir = Path('migrations')
          if not migration_dir.exists():
              print('No migrations directory; nothing to sequence.')
              raise SystemExit(0)

          migrations = sorted(migration_dir.glob('*.sql'))
          pattern = re.compile(r'^(\d{3})_[a-z0-9][a-z0-9_]*\.sql$')
          failures = []
          numbers = []

          for path in migrations:
              match = pattern.fullmatch(path.name)
              if not match:
                  failures.append(
                      f'{path}: filename must match NNN_lowercase_name.sql'
                  )
                  continue
              numbers.append((int(match.group(1)), path.name))

          seen = {}
          for number, name in numbers:
              if number in seen:
                  failures.append(
                      f'duplicate migration number {number:03d}: {seen[number]} and {name}'
                  )
              else:
                  seen[number] = name

          ordered = sorted(seen)
          if ordered:
              expected = list(range(1, max(ordered) + 1))
              if ordered != expected:
                  missing = sorted(set(expected) - set(ordered))
                  failures.append(
                      'migration sequence has gaps: ' + ', '.join(f'{n:03d}' for n in missing)
                  )

          if failures:
              print('ERROR: migration sequence contract failed:', file=sys.stderr)
              for failure in failures:
                  print(f'  - {failure}', file=sys.stderr)
              raise SystemExit(1)

          print(f'Migration sequence is valid: {len(migrations)} file(s), contiguous and unique.')
          PY

      - name: Run non-production staging preflight
        env:
          APP_ENV: staging
          APP_URL: https://staging.invalid
          DB_HOST: localhost
          DB_NAME: exd_staging_ci
          DB_USER: exd_ci
          DB_PASS: ci-placeholder-not-a-secret
        run: php staging_check.php

      - name: Confirm live domain and subdomains are blocked
        env:
          APP_ENV: staging
          DB_HOST: localhost
          DB_NAME: exd_staging_ci
          DB_USER: exd_ci
          DB_PASS: ci-placeholder-not-a-secret
        shell: bash
        run: |
          set -euo pipefail
          for url in https://elawaady.com https://www.elawaady.com https://admin.elawaady.com; do
            if APP_URL="$url" php staging_check.php; then
              echo "ERROR: live-domain guard unexpectedly passed for $url" >&2
              exit 1
            fi
          done
          echo 'Live-domain guard correctly rejected elawaady.com and its subdomains.'

      - name: Confirm lookalike host is not falsely blocked
        env:
          APP_ENV: staging
          APP_URL: https://elawaady.com.attacker.invalid
          DB_HOST: localhost
          DB_NAME: exd_staging_ci
          DB_USER: exd_ci
          DB_PASS: ci-placeholder-not-a-secret
        run: php staging_check.php

      - name: Confirm malformed staging URL is rejected
        env:
          APP_ENV: staging
          APP_URL: elawaady-staging
          DB_HOST: localhost
          DB_NAME: exd_staging_ci
          DB_USER: exd_ci
          DB_PASS: ci-placeholder-not-a-secret
        shell: bash
        run: |
          set -euo pipefail
          if php staging_check.php; then
            echo 'ERROR: malformed APP_URL unexpectedly passed.' >&2
            exit 1
          fi
          echo 'Malformed APP_URL correctly rejected.'

name: Staging Readiness

on:
  workflow_run:
    workflows:
      - Storefront Safety
      - Homepage Contract
      - Migration Smoke
      - Catalog Visual Contract
      - Backend production safety gate
      - Auth Integration
      - Order Wallet Integration
      - Platform Integration
      - Staging Environment Contract
      - Staging Configuration Contract
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify-required-checks:
    if: github.event.workflow_run.head_branch == 'chatgpt/store-build'
    runs-on: ubuntu-latest
    steps:
      - name: Check out immutable staging candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate machine-readable staging contract
        run: |
          php -l tests/staging_manifest_contract.php
          php tests/staging_manifest_contract.php

      - name: Verify staging prerequisite workflows
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'Storefront Safety',
              'Homepage Contract',
              'Migration Smoke',
              'Catalog Visual Contract',
              'Backend production safety gate',
              'Auth Integration',
              'Order Wallet Integration',
              'Platform Integration',
              'Staging Environment Contract',
              'Staging Configuration Contract',
            ];
            const trigger = context.payload.workflow_run;
            const sha = trigger.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'chatgpt/store-build';

            // A failure on the candidate commit must block immediately.
            if (required.includes(trigger.name) && trigger.conclusion !== 'success') {
              core.setFailed(`${trigger.name} failed for staging candidate ${sha} with conclusion: ${trigger.conclusion || 'unknown'}`);
              return;
            }

            // Every required workflow must complete successfully on the exact candidate SHA.
            // Reusing ancestor evidence can hide regressions introduced by the candidate commit.
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch,
              status: 'completed',
              per_page: 100,
            });

            const accepted = new Map();
            const failures = [];

            for (const name of required) {
              const runs = data.workflow_runs
                .filter(run => run.name === name && run.head_sha === sha)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              const latestExact = runs[0] || null;
              if (!latestExact) {
                failures.push(`${name}: no completed run found on exact candidate SHA ${sha}`);
                continue;
              }

              if (latestExact.conclusion !== 'success') {
                failures.push(`${name}: run ${latestExact.id} on ${sha} concluded ${latestExact.conclusion || 'unknown'}`);
                continue;
              }

              accepted.set(name, latestExact);
            }

            if (failures.length) {
              core.setFailed(`Staging is not ready for ${sha}. ${failures.join('; ')}`);
              return;
            }

            for (const [name, run] of accepted) {
              core.info(`${name}: accepted successful run ${run.id} on exact candidate SHA ${run.head_sha}`);
            }
            core.notice(`Staging prerequisites are green for ${sha}. This workflow performs validation only and never deploys.`);

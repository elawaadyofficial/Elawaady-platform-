name: Staging Readiness

on:
  workflow_run:
    workflows:
      - Storefront Safety
      - Homepage Contract
      - Migration Smoke
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify-required-checks:
    if: github.event.workflow_run.head_branch == 'chatgpt/store-build'
    runs-on: ubuntu-latest
    steps:
      - name: Verify all staging prerequisite workflows passed for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'Storefront Safety',
              'Homepage Contract',
              'Migration Smoke',
            ];
            const sha = context.payload.workflow_run.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 100,
            });

            const latestByName = new Map();
            for (const run of data.workflow_runs) {
              if (!required.includes(run.name)) continue;
              const previous = latestByName.get(run.name);
              if (!previous || new Date(run.created_at) > new Date(previous.created_at)) {
                latestByName.set(run.name, run);
              }
            }

            const failures = [];
            for (const name of required) {
              const run = latestByName.get(name);
              if (!run) {
                failures.push(`${name}: missing for ${sha}`);
                continue;
              }
              if (run.status !== 'completed') {
                failures.push(`${name}: ${run.status}`);
                continue;
              }
              if (run.conclusion !== 'success') {
                failures.push(`${name}: ${run.conclusion || 'no conclusion'}`);
              }
            }

            if (failures.length) {
              core.setFailed(`Staging is not ready for ${sha}. ${failures.join('; ')}`);
              return;
            }

            core.notice(`Staging prerequisites passed for ${sha}. No deployment is performed by this workflow.`);

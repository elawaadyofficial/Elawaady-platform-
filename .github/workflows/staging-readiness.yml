name: Staging Readiness

on:
  workflow_run:
    workflows:
      - Storefront Safety
      - Homepage Contract
      - Migration Smoke
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: staging-readiness-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  verify-required-checks:
    if: github.event.workflow_run.head_branch == 'chatgpt/store-build'
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging prerequisite workflows
        uses: actions/github-script@v7
        with:
          script: |
            const required = [
              'Storefront Safety',
              'Homepage Contract',
              'Migration Smoke',
            ];
            const trigger = context.payload.workflow_run;
            const sha = trigger.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'chatgpt/store-build';

            // Never allow an older green run to mask a failure on the candidate commit.
            if (required.includes(trigger.name) && trigger.conclusion !== 'success') {
              core.setFailed(`${trigger.name} failed for staging candidate ${sha} with conclusion: ${trigger.conclusion || 'unknown'}`);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch,
              status: 'success',
              per_page: 100,
            });

            const candidates = new Map(required.map(name => [name, []]));
            for (const run of data.workflow_runs) {
              if (required.includes(run.name)) candidates.get(run.name).push(run);
            }

            const accepted = new Map();
            const failures = [];

            for (const name of required) {
              const runs = candidates.get(name)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              for (const run of runs) {
                if (run.head_sha === sha) {
                  accepted.set(name, run);
                  break;
                }

                try {
                  const comparison = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: run.head_sha,
                    head: sha,
                  });
                  if (comparison.data.status === 'ahead' || comparison.data.status === 'identical') {
                    accepted.set(name, run);
                    break;
                  }
                } catch (error) {
                  core.debug(`Unable to compare ${run.head_sha} to ${sha}: ${error.message}`);
                }
              }

              if (!accepted.has(name)) {
                failures.push(`${name}: no successful run found on this commit or an ancestor`);
              }
            }

            if (failures.length) {
              core.setFailed(`Staging is not ready for ${sha}. ${failures.join('; ')}`);
              return;
            }

            for (const [name, run] of accepted) {
              core.info(`${name}: accepted successful run ${run.id} at ${run.head_sha}`);
            }
            core.notice(`Staging prerequisites are green for ${sha}. This workflow performs validation only and never deploys.`);

name: Bootstrap reviewed backend source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/store-build
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download reviewed Gemini bundle
        run: |
          python -m pip install --upgrade pip gdown
          gdown --id 1D_b0bQRLZTF0uWyNku-QlJVa2mW6k5J7 -O /tmp/elawaady-backend.zip
          test -s /tmp/elawaady-backend.zip

      - name: Extract reviewed backend into repository
        run: |
          rm -rf /tmp/elawaady-backend
          mkdir -p /tmp/elawaady-backend
          unzip -q /tmp/elawaady-backend.zip -d /tmp/elawaady-backend
          mkdir -p backend
          rsync -a --delete /tmp/elawaady-backend/src/ backend/src/
          rsync -a --delete /tmp/elawaady-backend/database/ backend/database/
          rsync -a --delete /tmp/elawaady-backend/tests/ backend/tests/
          cp /tmp/elawaady-backend/wsgi.py backend/wsgi.py
          cp /tmp/elawaady-backend/requirements.txt backend/requirements.txt
          find backend -type d -name '__pycache__' -prune -exec rm -rf {} +
          find backend -type f -name '*.pyc' -delete
          rm -f backend/database/platform_migrated.sql

      - name: Apply production-safe files already reviewed in branch
        run: |
          test -f backend/passenger_wsgi.py
          test -f backend/init_db.py
          test -f backend/production_check.py
          test -f backend/.env.example

      - name: Install dependencies and run full tests
        run: |
          python -m pip install -r backend/requirements.txt pytest
          cd backend
          python -m pytest -q

      - name: Commit extracted source only if tests pass
        run: |
          git config user.name 'Elawaady Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/src backend/database backend/tests backend/wsgi.py backend/requirements.txt
          if git diff --cached --quiet; then
            echo 'No backend source changes to commit.'
            exit 0
          fi
          git commit -m 'build: import reviewed backend source after 52-test gate'
          git push origin HEAD:chatgpt/store-build

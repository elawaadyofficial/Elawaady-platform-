name: Backend source recovery audit

on:
  push:
    branches:
      - chatgpt/store-build
    paths:
      - '.github/workflows/bootstrap-backend.yml'
      - 'backend/source_recovery_audit.json'
      - 'backend/source_sanitization_policy.json'
      - 'backend/source_admission_contract.py'
      - 'backend/validate_source_candidate.py'
      - 'backend/release_readiness.py'
      - 'backend/recovery_checks/**'
      - 'backend/source_bundle/**'
      - 'backend/source_bundle_inspect.py'
      - 'backend/src/**'
      - 'backend/database/**'
      - 'backend/tests/**'
  pull_request:
    paths:
      - '.github/workflows/bootstrap-backend.yml'
      - 'backend/source_recovery_audit.json'
      - 'backend/source_sanitization_policy.json'
      - 'backend/source_admission_contract.py'
      - 'backend/validate_source_candidate.py'
      - 'backend/release_readiness.py'
      - 'backend/recovery_checks/**'
      - 'backend/source_bundle/**'
      - 'backend/source_bundle_inspect.py'
      - 'backend/src/**'
      - 'backend/database/**'
      - 'backend/tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate recovery audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('backend/source_recovery_audit.json').read_text(encoding='utf-8'))
          policy = json.loads(Path('backend/source_sanitization_policy.json').read_text(encoding='utf-8'))
          assert audit['production_deploy_allowed'] is False
          assert audit['raw_source_import_allowed'] is False
          assert audit['review_state'] == 'sanitization_required_before_import'
          assert len(audit['reviewed_source']['sha256']) == 64
          assert audit['reviewed_source']['drive_file_id']
          assert audit['sanitized_validation']['pytest_passed'] == 54
          assert policy['production_deploy_allowed'] is False
          assert policy['raw_source_import_allowed'] is False
          assert policy['reviewed_archive_sha256'] == audit['reviewed_source']['sha256']
          assert policy['required_validation']['pytest_expected_passed'] == 54
          assert policy['required_validation']['python_compileall'] is True
          assert policy['required_validation']['production_preflight'] is True
          assert policy['required_validation']['source_admission_contract'] is True
          required_remediations = {item['id'] for item in policy['required_remediations']}
          assert {
              'relocatable_paths',
              'no_raw_database_payloads',
              'no_bootstrap_credentials',
              'safe_local_storage_default',
          } <= required_remediations
          excluded = set(policy['excluded_paths'])
          assert 'backups/' in excluded
          assert 'database/platform_migrated.sql' in excluded
          PY

      - name: Validate source candidate policy tool
        run: python backend/validate_source_candidate.py --policy-only

      - name: Regression-test source candidate validator
        run: python backend/recovery_checks/test_validate_source_candidate.py

      - name: Enforce sanitized source admission boundary
        run: python backend/source_admission_contract.py

      - name: Report backend release readiness without network access
        run: |
          set +e
          output=$(python backend/release_readiness.py 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 2
          echo "$output" | grep -q '"network_access": false'
          echo "$output" | grep -q '"production_access": false'

      - name: Prove historical recovery bundle remains incomplete
        run: |
          set +e
          output=$(python backend/source_bundle_inspect.py 2>&1)
          status=$?
          set -e
          test "$status" -ne 0
          echo "$output"
          echo "$output" | grep -q 'found 1/8 chunks'
          echo "$output" | grep -q 'part08.b64'

      - name: Reject write or deployment capability in this audit workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/bootstrap-backend.yml').read_text(encoding='utf-8')
          forbidden = [
              'contents' + ': ' + 'write',
              'git' + ' push',
              'rsync' + ' --delete',
              's' + 'cp ',
              's' + 'sh ',
              'g' + 'down ',
          ]
          found = [token for token in forbidden if token in text]
          assert not found, f'unsafe recovery workflow capability found: {found}'
          PY
